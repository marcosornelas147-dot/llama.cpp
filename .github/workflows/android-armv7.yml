
name: Android ARMv7-A Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-armv7.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 4783b1145c7073bb809f4c282ff4853cbfe42954
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip python3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure ARMv7-A
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_ARM_NEON=ON \
            -DANDROID_ARM_MODE=arm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/package" \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON

      - name: Compile
        run: |
          cmake --build build-android --parallel 4

      - name: Package
        run: |
          cmake --install build-android
          cd package
          zip -r ../llama-android-armv7a.zip .

      - name: Upload ARMv7-A build
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-armv7a
          path: llama-android-armv7a.zip
          retention-days: 7

      - name: Publish downloadable ARMv7-A release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armv7-latest
          name: llama.cpp Android ARMv7-A (latest)
          body: Automated ARMv7-A Android build for Termux-compatible ARM devices.
          files: llama-android-armv7a.zip
          overwrite_files: true
          make_latest: false

